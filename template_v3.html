<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="1800">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jensens">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<title>{{TITLE}}</title>
<!-- v3 "Two soft pages": Today / This week crossfade every {{ROTATE_SECONDS}}s. Sizes are authored in rem (1rem = 1/18 of
     the mockup's 820x1180 px); build.py rewrites them to calc(var(--fs)*n) so each page auto-fits its own base size. -->
<style>
:root{
  --fs:18px;
  --text:#283044; --muted:#69718a; --faint:#a0a7b8; --line:#EEF0F4;
  --luke:#6FA8FF; --luke-dk:#2C62C0; --luke-bg:#EAF2FF; --luke-mid:#D3E4FF;
  --wyatt:#5FD39A; --wyatt-dk:#1C8452; --wyatt-bg:#E6F8EF; --wyatt-mid:#C9F0DC;
  --tanner:#FFAE57; --tanner-dk:#B4620C; --tanner-bg:#FFF1E2; --tanner-mid:#FFE0BF;
  --parents:#C9A0FF; --parents-dk:#7646C2; --parents-bg:#F4EEFF; --parents-mid:#E6D8FF;
  --peach:#FFF2E8; --rose:#FDEEF4; --butter:#FFF8DC; --mint:#EAF8F1; --sky:#EEF5FF; --red-bg:#FDECEC; --red:#CF4436; --amber:#9A6A06;
  --nav:calc(46px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;font-family:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,"Segoe UI",sans-serif;color:var(--text);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none;cursor:default}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex:none}
.p-luke{--c:var(--luke);--dk:var(--luke-dk);--bg:var(--luke-bg);--mid:var(--luke-mid)}
.p-wyatt{--c:var(--wyatt);--dk:var(--wyatt-dk);--bg:var(--wyatt-bg);--mid:var(--wyatt-mid)}
.p-tanner{--c:var(--tanner);--dk:var(--tanner-dk);--bg:var(--tanner-bg);--mid:var(--tanner-mid)}
.p-parents{--c:var(--parents);--dk:var(--parents-dk);--bg:var(--parents-bg);--mid:var(--parents-mid)}
.p-family{--c:#FF8A80;--dk:#B8443A;--bg:#FFEDEB;--mid:#FFD6D2}
.p-all{--c:#F2B33D;--dk:#9A6A06;--bg:#FFF7E0;--mid:#FFEBB3}
.p-red{--c:#F08A80;--dk:var(--red);--bg:var(--red-bg);--mid:#FAD3D0}
.p-leaf{--c:#7FCB8F;--dk:#2F7D43;--bg:#E9F7EC;--mid:#CDEED5}

#stage{position:fixed;left:0;right:0;top:0;bottom:var(--nav);cursor:pointer;-webkit-tap-highlight-color:transparent}
.page{position:absolute;inset:0;display:flex;flex-direction:column;gap:1.2rem;overflow:hidden;
  padding:max(40px,calc(env(safe-area-inset-top) + 18px)) max(28px,env(safe-area-inset-right)) 14px max(28px,env(safe-area-inset-left));
  opacity:0;visibility:hidden;transition:opacity .9s ease,visibility 0s linear .9s}
.page.on{opacity:1;visibility:visible;transition:opacity .9s ease}
.page.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.page>*{flex:none;min-width:0}

/* header (both pages) */
header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
header .hl{flex:1 1 auto;min-width:0}
.fam{font-size:1.75rem;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.motto{margin-top:.2rem;font-size:.92rem;font-weight:600;color:#C08A2E;max-width:24rem;line-height:1.3;text-wrap:balance}
.clk{text-align:right;flex:none}
.time{font-size:3.45rem;font-weight:300;line-height:1;letter-spacing:-.03em}
.time small{font-size:1.22rem;font-weight:600;color:var(--muted);margin-left:.33rem;letter-spacing:0}
.date{font-size:1.85rem;font-weight:800;color:var(--text);margin-top:.3rem;line-height:1.1;letter-spacing:-.01em;white-space:nowrap}
.date b{font-weight:800;color:#C08A2E}
.upd{margin-top:.3rem;font-size:.72rem;font-weight:700;color:var(--faint)}
.upd .stale{display:none;color:#B4620C;background:#FFF1D6;border-radius:99px;padding:.05rem .45rem;margin-left:.3rem}
body.stale .upd{color:#B4620C} body.stale .upd .stale{display:inline}
.h{display:flex;align-items:baseline;gap:.67rem;font-size:1.39rem;font-weight:800;margin-bottom:-.3rem}
.h span{font-size:.95rem;font-weight:700;color:var(--faint)}
.sk{display:flex;align-items:center;gap:.55rem;font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.bub{width:3.3rem;height:3.3rem;border-radius:1.1rem;background:var(--mid);color:var(--dk);display:grid;place-items:center;flex:none}
.bub .ic{font-size:1.6rem}
.sk .bub{width:2.33rem;height:2.33rem;border-radius:.83rem;background:#fff}
.sk .bub .ic{font-size:1.22rem}

/* page 1: kid cards */
.kids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem;flex:1 0 auto}
.kid{background:var(--bg);border-radius:1.9rem;padding:1.5rem 1.15rem 1.2rem;display:flex;flex-direction:column;min-width:0}
.kid .top{display:flex;align-items:center;gap:.67rem}
.av{width:3.9rem;height:3.9rem;border-radius:1.4rem;background:var(--c);color:#fff;display:grid;place-items:center;font-size:1.95rem;font-weight:800;flex:none;transform:rotate(-4deg)}
.nm{font-size:1.78rem;font-weight:800;color:var(--dk);line-height:1}
.gr{font-size:.95rem;font-weight:700;color:var(--muted);margin-top:.2rem}
.items{display:none;margin:1.45rem 0 1.15rem;flex-direction:column;gap:1.1rem}
.items.on{display:flex}
.it{display:flex;align-items:center;gap:.75rem;font-size:1.38rem;font-weight:700;line-height:1.18;min-width:0}
.itx{min-width:0;overflow-wrap:anywhere}
.it small{display:block;font-size:.95rem;font-weight:700;color:var(--muted);margin-top:.14rem}
.it.st-off .itt{color:var(--red)} .it.st-off .bub{background:#FAD3D0;color:var(--red)}
.it.st-half .itt{color:var(--amber)} .it.st-half .bub{background:#FFEBB3;color:var(--amber)}
.it.free{color:var(--faint)} .it.free .itt{font-size:1.05rem}
.ymtag{display:inline-block;font-size:.68em;font-weight:800;letter-spacing:.03em;line-height:1.15;color:var(--dk);background:var(--mid);border-radius:.45em;padding:.1em .45em;margin:0 .32em .06em 0;vertical-align:.08em}
.e .ymtag{font-size:.74em;margin-bottom:.04em}
.et small.ymtag{display:inline-block;font-size:.72rem;font-weight:800;margin:.16rem 0 0;padding:.06rem .42rem;letter-spacing:.02em}
.tmrw .ymtag{font-size:.78em;vertical-align:.06em}
.tmrw{margin-top:auto;background:rgba(255,255,255,.75);border-radius:1.1rem;padding:.72rem .85rem;font-size:1.02rem;font-weight:700;color:var(--muted);line-height:1.3;overflow-wrap:anywhere}
.tmrw b{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--dk);margin-bottom:.16rem}
.tm{display:none} .tm.on{display:inline}
.tmrw .no{color:var(--red)} .tmrw .hf{color:var(--amber)}

/* page 1: parents strip (only when there's something today/tomorrow) */
.pstrip{display:flex;align-items:center;gap:.6rem;background:var(--parents-bg);border-radius:1.4rem;padding:.6rem .9rem;flex-wrap:wrap}
.pstrip.none{display:none}
.pstrip .lab{font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--parents-dk);display:flex;align-items:center;gap:.4rem}
.pday{display:none;align-items:center;gap:.45rem;flex-wrap:wrap}
.pday.on{display:inline-flex}
.pday .pd{font-size:.72rem;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.pb{display:inline-flex;align-items:center;gap:.35rem;background:#fff;border-radius:.8rem;padding:.3rem .6rem;font-size:.95rem;font-weight:700}
.pb .ic{color:var(--parents-dk);font-size:1.05rem}
.pb small{font-size:.78rem;color:var(--muted);font-weight:700}
.pb.away{color:var(--parents-dk);font-weight:800}

/* page 1: spiritual */
.spirit{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.1rem}
.sc{border-radius:1.67rem;padding:1.4rem 1.45rem 1.35rem;display:flex;flex-direction:column;gap:.42rem;min-width:0}
.sc.cfm{background:var(--peach)} .sc.fsy{background:var(--rose)}
.cfm .sk{color:#B5651D} .fsy .sk{color:#B2477A}
.prayer{margin:.35em 0 .1em;font-size:1.12rem;font-weight:700;color:#8a5a2b;display:flex;align-items:center;gap:.4em}
.prayer .pr-n{display:none;padding:.1em .7em;border-radius:1em;background:var(--bg);color:var(--dk);border:2px solid var(--c)}
.prayer .pr-n.on{display:inline-block}
.stt{font-size:1.55rem;font-weight:800;line-height:1.16;margin-top:.28rem}
.srd{font-size:1.08rem;font-weight:800;color:#B5651D}
.fsy .srd{color:#B2477A}
.sq{font-size:1.15rem;font-weight:600;color:var(--muted);line-height:1.32}
.sq i{font-style:normal;color:var(--faint);font-size:.78rem}
.sq b{display:inline-block;font-size:.67rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#B2477A;margin-right:.4rem}
.sq.t-tmrw{font-size:.9rem} .sq.t-tmrw b{color:var(--faint)}
.tip{display:none} .tip.on{display:inline}
.tbox{background:rgba(255,255,255,.72);border-radius:1.2rem;padding:1rem 1.1rem 1.05rem;margin-top:.55rem;display:flex;flex-direction:column;gap:.4rem}
.cfd{display:none} .cfd.on{display:flex}
.cfd-none{display:none} .cfd-none.on{display:block}
.tk{font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#B5651D}
.tk span{margin-left:.35rem;font-size:.9rem;letter-spacing:.01em;text-transform:none}
.fsy .tk{color:#B2477A}
.cq{font-size:1.55rem;font-weight:800;line-height:1.24}
.ct{font-size:1.16rem;font-weight:600;color:var(--muted);line-height:1.35}
.ft{font-size:1.55rem;font-weight:800;line-height:1.26}
.fsy .t-tmrw{margin-top:.3rem}
.pending .stt{color:var(--muted);font-style:italic;font-weight:600}

/* page 2: day tiles */
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:1fr;gap:.67rem;flex:1 0 auto}
.day{display:none;border-radius:1.45rem;background:#F6F7FA;padding:.78rem .67rem .67rem;flex-direction:column;min-width:0}
.day.on{display:flex}
.day.today{background:#FFF6DA;box-shadow:inset 0 0 0 3px #F4C548}
.day.brk{background:var(--mint)}
.dw{font-size:.83rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.today .dw{color:#A67A00}
.dn{font-size:2.2rem;font-weight:800;line-height:1;margin-top:.11rem}
.wkend .dn{color:#4a5270}
.ev{display:flex;flex-direction:column;gap:.5rem;margin:.67rem 0 .4rem}
.e{display:flex;align-items:center;gap:.45rem;font-size:.85rem;font-weight:700;line-height:1.12;min-width:0}
.e .bub{width:2rem;height:2rem;border-radius:.72rem}
.e .bub .ic{font-size:1.1rem}
.et{min-width:0;overflow-wrap:anywhere}
.el{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:normal}
.e.yth .el{-webkit-line-clamp:5}
.et small{display:block;font-size:.72rem;color:var(--dk);font-weight:800}
.dots{display:flex;gap:.17rem;margin-top:.17rem}
.dots i{width:.5rem;height:.5rem;border-radius:50%;background:var(--c)}
.more{font-size:.72rem;font-weight:800;color:var(--faint);padding-left:.2rem}
.away{margin-top:auto;display:flex;align-items:center;gap:.33rem;background:var(--parents-bg);color:var(--parents-dk);border-radius:.67rem;padding:.33rem .45rem;font-size:.72rem;font-weight:800;min-width:0;overflow:hidden;white-space:nowrap}
.away .ic{font-size:.85rem}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45rem;color:var(--dk);font-size:.95rem;font-weight:800;text-align:center;padding:.5rem 0}
.big .ic{font-size:2.9rem}
.quiet{flex:1;display:grid;place-items:center;color:var(--faint);font-size:.83rem;font-weight:700;padding:.5rem 0}

/* nav: solid strip so nothing sits under the home indicator */
#nav{position:fixed;left:0;right:0;bottom:0;height:var(--nav);padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:center;align-items:center;gap:10px;z-index:5}
#nav .dot{width:12px;height:12px;border-radius:99px;border:0;background:#DDE0E8;padding:0;cursor:pointer;transition:width .4s,background .4s}
#nav .dot.on{width:34px;background:#F4C548}
#nav .nl{font-size:14px;font-weight:700;color:var(--faint);margin-left:4px;min-width:5.5em}
#nav .pz{display:none;margin-left:8px;border:0;background:#FFF1D6;color:#9A6A06;font:inherit;font-size:14px;font-weight:800;border-radius:99px;padding:6px 14px;cursor:pointer}
body.paused #nav .pz{display:inline}
#prog{position:fixed;left:0;bottom:0;height:4px;width:0;background:#F4C548;opacity:.6;border-radius:0 3px 3px 0;z-index:6}
body.paused #prog{background:#C9A0FF}
/* BYU games: low-key navy items + pill; page-1 header line for today/tomorrow */
.byutag{display:inline-block;font-size:.66em;font-weight:900;letter-spacing:.06em;line-height:1.15;color:#fff;background:#002E5D;border-radius:.4em;padding:.12em .42em;margin:0 .3em .06em 0;vertical-align:.1em}
.e.byu .bub{background:#E3EAF3;color:#002E5D}
.e.byu .el{color:#3A4A63;font-weight:700}
.e.byu small{color:var(--muted)}
.byuline{display:none;margin-top:.45rem;flex-wrap:wrap;gap:.3rem .5rem}
.byuline.on{display:flex}
.bg{display:none;align-items:center;gap:.35rem;font-size:.86rem;font-weight:700;color:#3A4A63;background:#EEF2F8;border-radius:.75rem;padding:.22rem .6rem .22rem .45rem;max-width:100%}
.bg.on{display:inline-flex}
.bg .ic{color:#002E5D;font-size:1rem}
.bg .bd{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.bg small{font-size:.78rem;color:var(--muted);font-weight:700}
.bg .byutag{font-size:.7rem;margin:0}

/* easter egg: faded BYU-navy "Y" in the nav corner; tap -> Go Cougs! */
#yegg{position:absolute;right:max(14px,env(safe-area-inset-right));top:0;height:46px;width:52px;border:0;background:none;padding:0;cursor:pointer;
  display:grid;place-items:center;-webkit-tap-highlight-color:transparent;opacity:.16;transition:opacity .4s}
#yegg svg{width:26px;height:26px;display:block}
#yegg.go{opacity:1}
#yegg.go svg{animation:yspin 1.1s cubic-bezier(.3,1.6,.5,1)}
@keyframes yspin{0%{transform:scale(1) rotate(0)}35%{transform:scale(1.7) rotate(-14deg)}70%{transform:scale(1.25) rotate(380deg)}100%{transform:scale(1) rotate(360deg)}}
#cougs{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(var(--nav) + 10px);z-index:7;pointer-events:none;
  background:#002E5D;color:#fff;font-weight:900;font-size:22px;letter-spacing:.02em;border-radius:16px;padding:10px 18px;box-shadow:0 8px 24px rgba(0,46,93,.28);
  opacity:0;transform:translateY(16px) scale(.8)}
#cougs.go{animation:cougs 2.6s ease forwards}
@keyframes cougs{0%{opacity:0;transform:translateY(16px) scale(.8)}12%{opacity:1;transform:translateY(0) scale(1.08)}20%{transform:translateY(0) scale(1)}80%{opacity:1;transform:translateY(-6px) scale(1)}100%{opacity:0;transform:translateY(-26px) scale(.95)}}
.yfly{position:fixed;z-index:7;pointer-events:none;width:22px;height:22px;animation:yfly 1.6s ease-out forwards}
@keyframes yfly{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.6)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.1)}}
/* hidden grades card (motto triple-tap). px sizes: it lives outside the auto-fitted pages */
.motto{touch-action:manipulation}
#grades{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(40,48,68,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;transition:opacity .25s}
#grades.on{display:flex}
#grades.show{opacity:1}
.gcard{position:relative;width:min(760px,100%);max-height:100%;overflow:hidden;background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(40,48,68,.25);
  padding:22px 22px 26px;display:flex;flex-direction:column;gap:16px;transform:scale(.96);transition:transform .25s}
#grades.show .gcard{transform:none}
.ghd{display:flex;align-items:center;justify-content:space-between}
.ght{font-size:26px;font-weight:800;letter-spacing:-.01em}
.gx{width:40px;height:40px;border-radius:50%;border:0;background:#F1F3F7;color:var(--muted);font:inherit;font-size:22px;font-weight:700;line-height:1;cursor:pointer}
.gcols{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:12px;min-height:0}
.gcol{background:var(--bg);border-radius:20px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.gk{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:800;color:var(--dk)}
.gk .av{width:32px;height:32px;border-radius:11px;font-size:16px;transform:rotate(-4deg)}
.glist{display:flex;flex-direction:column;gap:6px}
.grow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(255,255,255,.8);border-radius:12px;padding:7px 10px;font-size:16px;font-weight:700}
.gn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp{flex:none;font-weight:800;border-radius:8px;padding:2px 7px;font-size:15px}
.gp.ga{color:#1C7A47;background:#DDF5E7} .gp.gb{color:#9A6A06;background:#FFF0C7} .gp.gc{color:#C23A2E;background:#FDE1DE}
.gsrc{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:auto}
.gnone{flex:1;display:grid;place-items:center;text-align:center;color:var(--faint);font-size:15px;font-weight:700;padding:18px 4px;font-style:italic}
.gbar{position:absolute;left:0;bottom:0;height:5px;width:100%;background:#C9A0FF;transform-origin:left;border-radius:0 3px 3px 0}
#grades.show .gbar{animation:gbar 30s linear forwards}
@keyframes gbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media (max-width:640px){.gcols{grid-template-columns:1fr}}
</style>
</head>
<body data-rotate="{{ROTATE_SECONDS}}" data-tz="{{TZ}}" data-last="{{LAST_ISO}}" data-stale-days="{{STALE_DAYS}}" data-week-start="{{WEEK_START}}" data-build-date="{{BUILD_DATE}}">
{{SPRITE}}
<div id="stage">

<!-- ====================== PAGE 1: TODAY ====================== -->
<section class="page on" id="p1" data-name="Today">
  <header>
    <div class="hl"><div class="fam">{{FAMILY}}</div>{{MOTTO}}<div class="byuline" id="byuline">{{BYU_TODAY}}</div></div>
    <div class="clk"><div class="time js-time">&nbsp;</div><div class="date js-date">&nbsp;</div>
      <div class="upd">Updated {{LAST_LABEL}}<span class="stale">needs refresh</span></div></div>
  </header>
  <div class="kids">{{KIDS}}</div>
  <div class="pstrip" id="pstrip"><span class="lab"><svg class="ic"><use href="#i-users"/></svg>Parents</span>{{PARENTS}}</div>
  <div class="spirit">{{SPIRIT}}</div>
</section>

<!-- ====================== PAGE 2: THIS WEEK ====================== -->
<section class="page" id="p2" data-name="This week">
  <header>
    <div class="hl"><div class="fam">{{FAMILY}}</div>{{MOTTO}}</div>
    <div class="clk"><div class="time js-time">&nbsp;</div><div class="date js-date">&nbsp;</div>
      <div class="upd">Updated {{LAST_LABEL}}<span class="stale">needs refresh</span></div></div>
  </header>
  <div class="h">This week <span id="range"></span></div>
  <div class="days">{{TILES}}</div>
</section>
</div>

<nav id="nav" aria-label="Pages"><button class="dot on" data-i="0" aria-label="Today"></button><button class="dot" data-i="1" aria-label="This week"></button><span class="nl" id="navl">Today</span><button class="pz" id="resume" type="button">Paused <span id="pzt"></span> · tap to resume</button><button id="yegg" type="button" aria-label="Go Cougs"><svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#002E5D" d="M2 4h12v4.2h-2.6L16 15.6l4.6-7.4H18V4h12v4.2h-2.2L19.6 20v4h3v4H9.4v-4h3v-4L4.2 8.2H2z"/></svg></button></nav>
<div id="cougs" aria-hidden="true">Go Cougs!</div>
<div id="grades" aria-hidden="true"><div class="gcard" role="dialog" aria-label="Grades"><div class="ghd"><div class="ght">Grades</div><button class="gx" id="gx" type="button" aria-label="Close">&times;</button></div>
  <div class="gcols">{{GRADES}}</div><div class="gbar"></div></div></div>
<div id="prog"></div>

<script>
(function(){
  var B=document.body, TZ=B.getAttribute('data-tz')||'America/Denver';
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function parts(d){var o={};try{new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit',hour12:true,weekday:'long'}).formatToParts(d).forEach(function(p){o[p.type]=p.value});}catch(e){}return o;}
  function ymd(d){var p=parts(d);return p.year+'-'+p.month+'-'+p.day;}
  function addDays(s,n){var a=s.split('-');var t=new Date(Date.UTC(+a[0],+a[1]-1,+a[2]+n,12));return t.toISOString().slice(0,10);}
  function dowOf(s){var a=s.split('-');return DOW[new Date(Date.UTC(+a[0],+a[1]-1,+a[2],12)).getUTCDay()];}
  function nice(s){var a=s.split('-');return dowOf(s)+' '+MON[+a[1]-1]+' '+(+a[2]);}
  function each(sel,fn,root){Array.prototype.forEach.call((root||document).querySelectorAll(sel),fn);}
  function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}

  var lastDay=null, TILES=10;
  function applyDay(today){
    var tmrw=addDays(today,1), dow=dowOf(today), dow1=dowOf(tmrw);
    // weekly prayer rotation (Sunday start) from the anchor week
    each('.prayer',function(pr){var a=pr.getAttribute('data-anchor'),n=+pr.getAttribute('data-n')||3;
      var d=Math.floor((Date.parse(today+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5), w=Math.floor(d/7), i=((w%n)+n)%n;
      each('.pr-n',function(el){el.classList.toggle('on',+el.getAttribute('data-i')===i);},pr);});
    // page 1: kid cards (youth tagged YM / All youth), parents strip, Come Follow Me, Strength of Youth
    each('[data-d0]',function(el){el.classList.toggle('on',el.getAttribute('data-d0')===today);});
    each('[data-d1]',function(el){el.classList.toggle('on',el.getAttribute('data-d1')===tmrw);});
    // parents strip: today + tomorrow; tomorrow is skipped when it would only repeat today's trip tag
    var pc=0, tTrips=null;
    each('.pday',function(el){if(el.getAttribute('data-date')===today)tTrips=el.getAttribute('data-trips');});
    each('.pday',function(el){var d=el.getAttribute('data-date'),on=d===today||d===tmrw;
      if(d===tmrw&&el.hasAttribute('data-only-trips')&&el.getAttribute('data-trips')===tTrips)on=false;
      el.classList.toggle('on',on);if(on)pc++;el.querySelector('.pd').textContent=d===today?'Today':'Tomorrow';});
    document.getElementById('pstrip').classList.toggle('none',!pc);
    byuDay(today,tmrw);
    each('.t-today .tip',function(el){el.classList.toggle('on',el.getAttribute('data-dow')===dow);});
    each('.t-tmrw .tip',function(el){el.classList.toggle('on',el.getAttribute('data-dow')===dow1);});
    // Come Follow Me: the week's queue (come_follow_me.daily) has one box per weekday; show today's, else the featured question
    var cn=0; each('.cfd',function(el){var on=el.getAttribute('data-dow')===dow;el.classList.toggle('on',on);if(on)cn++;});
    each('.cfd-none',function(el){el.classList.toggle('on',!cn);});
    // page 2: ten day tiles starting today
    var tend=addDays(today,TILES-1);
    each('.day',function(el){var d=el.getAttribute('data-date'),on=d>=today&&d<=tend;el.classList.toggle('on',on);el.classList.toggle('today',d===today);
      var w=el.querySelector('.dw');w.textContent=d===today?'Today':w.getAttribute('data-dow');});
    document.getElementById('range').textContent=nice(today)+' \u2013 '+nice(tend);
    var last=Date.parse(B.getAttribute('data-last')), lim=parseFloat(B.getAttribute('data-stale-days')||'8');
    B.classList.toggle('stale',!isNaN(last)&&(Date.now()-last)>lim*864e5);
    fit();
  }
  // BYU games line (page-1 header): today's and tomorrow's games; today's hides ~3.5 h after the start time
  function byuDay(today,tmrw){
    var n=0, now=Date.now();
    each('.bg',function(el){var d=el.getAttribute('data-date'),on=d===today||d===tmrw,end=el.getAttribute('data-end');
      if(d===today&&end&&now>Date.parse(end))on=false;
      el.classList.toggle('on',on);if(on)n++;
      el.querySelector('.bd').textContent=d===today?(el.hasAttribute('data-night')?'Tonight':'Today'):'Tomorrow';});
    var bl=document.getElementById('byuline'); if(bl)bl.classList.toggle('on',n>0);
  }
  function tick(){
    var now=new Date(), p=parts(now);
    if(p.hour){var tm=p.hour+':'+p.minute+'<small>'+(p.dayPeriod||p.dayperiod||'')+'</small>';
      var dt='<b>'+p.weekday+'</b>, '+new Intl.DateTimeFormat('en-US',{timeZone:TZ,month:'long',day:'numeric'}).format(now);
      each('.js-time',function(el){el.innerHTML=tm;}); each('.js-date',function(el){el.innerHTML=dt;});}
    var t=ymd(now); if(t!==lastDay){lastDay=t;applyDay(t);}
    else{var was=document.querySelectorAll('.bg.on').length;byuDay(t,addDays(t,1));if(document.querySelectorAll('.bg.on').length!==was)fit();}
  }

  // auto-fit each page: largest base size (--fs) with no overflow; scroll only below the floor
  var pages=[document.getElementById('p1'),document.getElementById('p2')];
  function fitPage(pg,W,H){
    var land=W>H, scale=land?Math.min(W/1180,H/820):Math.min(W/820,H/1180);
    var floor=Math.max(11,scale*(land?12:15)), hi=Math.max(floor,Math.min(28,scale*21)), lo=floor;
    pg.classList.remove('scroll'); pg.querySelector('header').style.removeProperty('--fs');
    var over=function(){return pg.scrollHeight>pg.clientHeight+1||pg.scrollWidth>pg.clientWidth+1;};
    // while growing, also stop before a calendar label's longest word gets wider than its tile (no mid-word breaks)
    var cramped=function(){var c=false;each('.day.on .el',function(el){if(el.scrollWidth>el.clientWidth+1)c=true;},pg);return c;};
    pg.style.setProperty('--fs',floor+'px');
    if(over()){pg.classList.add('scroll');return floor.toFixed(2)+'|scroll';}
    for(var i=0;i<11;i++){var mid=(lo+hi)/2;pg.style.setProperty('--fs',mid+'px');if(over()||(mid>floor+.5&&cramped()))hi=mid;else lo=mid;}
    pg.style.setProperty('--fs',lo+'px');
    return lo.toFixed(2);
  }
  function fit(){
    var vv=window.visualViewport,W=vv?vv.width:window.innerWidth,H=Math.min(window.innerHeight,vv?vv.height:1e9);
    var r=pages.map(function(pg){return fitPage(pg,W,H);});
    // identical header on both pages: use the smaller page's base size for both (shrinking a header never overflows)
    var hs=Math.min.apply(null,r.map(function(x){return parseFloat(x);}));
    pages.forEach(function(pg){pg.querySelector('header').style.setProperty('--fs',hs+'px');});
    B.setAttribute('data-fs','p1:'+r[0]+' p2:'+r[1]+' '+W+'x'+H);
  }

  // rotation: crossfade every ROT seconds; a tap switches page and pauses for 2 minutes ("Paused (m:ss) · tap to resume").
  // State is kept in localStorage so the 30-minute reload resumes where it was.
  var ROT=(parseFloat(B.getAttribute('data-rotate'))||30)*1000, PAUSE=120000, KEY='dash-v3-rot';
  var st=store(KEY)||{}, now0=Date.now();
  var cur=(st.i===0||st.i===1)?st.i:0, shownAt=(typeof st.t==='number'&&st.t<=now0)?st.t:now0, pausedUntil=st.p||0;
  if(pausedUntil&&pausedUntil<=now0){shownAt=Math.max(shownAt,pausedUntil);pausedUntil=0;}
  if(!pausedUntil&&now0-shownAt>=ROT){cur=(cur+1)%2;shownAt=now0;}
  var prog=document.getElementById('prog'), navl=document.getElementById('navl');
  function render(i){cur=i;
    pages.forEach(function(pg,k){pg.classList.toggle('on',k===i);if(k===i)pg.scrollTop=0;});
    each('#nav .dot',function(d,k){d.classList.toggle('on',k===i);});
    navl.textContent=pages[i].getAttribute('data-name');}
  function save(){store(KEY,{i:cur,t:shownAt,p:pausedUntil});}
  function show(i){render(i);shownAt=Date.now();save();}
  function loop(){
    var now=Date.now();
    if(pausedUntil&&now>=pausedUntil){shownAt=pausedUntil;pausedUntil=0;save();}
    var paused=!!pausedUntil; B.classList.toggle('paused',paused);
    if(paused){prog.style.width=(100*(pausedUntil-now)/PAUSE)+'%';var r=Math.ceil((pausedUntil-now)/1000);
      document.getElementById('pzt').textContent='('+Math.floor(r/60)+':'+('0'+r%60).slice(-2)+')';return;}
    if(now-shownAt>=ROT){show((cur+1)%2);now=shownAt;}
    prog.style.width=Math.min(100,100*(now-shownAt)/ROT)+'%';
  }
  function userGo(i){pausedUntil=Date.now()+PAUSE;show(i);loop();}
  document.getElementById('stage').addEventListener('click',function(){userGo((cur+1)%2);});
  each('#nav .dot',function(d){d.addEventListener('click',function(ev){ev.stopPropagation();userGo(+d.getAttribute('data-i'));});});
  document.getElementById('resume').addEventListener('click',function(ev){ev.stopPropagation();pausedUntil=0;shownAt=Date.now();save();loop();});
  render(cur); save(); loop(); setInterval(loop,200);

  // easter egg: the faded Y in the nav corner. Tap -> spin + "Go Cougs!" + a few flying Ys.
  // It sits in the nav (outside #stage) and stops propagation, so it never flips pages or pauses rotation.
  var yegg=document.getElementById('yegg'), cougs=document.getElementById('cougs'), yBusy=0;
  yegg.addEventListener('click',function(ev){ev.stopPropagation();ev.preventDefault();
    if(Date.now()<yBusy)return; yBusy=Date.now()+1400;
    yegg.classList.remove('go');cougs.classList.remove('go');void yegg.offsetWidth;
    yegg.classList.add('go');cougs.classList.add('go');
    var r=yegg.getBoundingClientRect(), svg=yegg.innerHTML;
    for(var i=0;i<9;i++){var f=document.createElement('div');f.className='yfly';f.innerHTML=svg;
      f.style.left=(r.left+r.width/2-11)+'px';f.style.top=(r.top+r.height/2-11)+'px';
      var a=Math.PI*(1.0+0.6*i/8), dist=110+Math.random()*120;
      f.style.setProperty('--dx',(Math.cos(a)*dist).toFixed(0)+'px');f.style.setProperty('--dy',(Math.sin(a)*dist).toFixed(0)+'px');
      f.style.setProperty('--r',((Math.random()-.5)*720).toFixed(0)+'deg');f.style.animationDelay=(i*40)+'ms';
      document.body.appendChild(f);setTimeout(function(x){return function(){x.remove();};}(f),2000);}
    setTimeout(function(){yegg.classList.remove('go');cougs.classList.remove('go');},2700);
  });


  // hidden grades card: three quick taps on the motto (each <400 ms apart, all within 700 ms) open it for 30 s.
  // Motto taps never reach #stage; a lone tap (or two) still flips the page like any other tap, once the
  // 400 ms triple-tap window has passed. The card sits outside #stage, so its taps never rotate/pause either.
  var gEl=document.getElementById('grades'), gTimer=0, gTaps=[], gSingle=0, G_GAP=400, G_TOTAL=700, G_OPEN=30000;
  function gClose(){clearTimeout(gTimer);gEl.classList.remove('show');setTimeout(function(){if(!gEl.classList.contains('show'))gEl.classList.remove('on');},260);gEl.setAttribute('aria-hidden','true');}
  function gOpen(){clearTimeout(gTimer);gEl.classList.remove('show');gEl.classList.add('on');void gEl.offsetWidth;gEl.classList.add('show');
    gEl.setAttribute('aria-hidden','false');gTimer=setTimeout(gClose,G_OPEN);}
  each('.motto',function(mo){mo.addEventListener('click',function(ev){ev.stopPropagation();
    var now=Date.now(); clearTimeout(gSingle);
    if(gTaps.length&&now-gTaps[gTaps.length-1]>G_GAP)gTaps=[];
    gTaps.push(now);
    if(gTaps.length>=3&&now-gTaps[gTaps.length-3]<=G_TOTAL){gTaps=[];gOpen();return;}
    gSingle=setTimeout(function(){gTaps=[];userGo((cur+1)%2);},G_GAP+20);});});
  gEl.addEventListener('click',function(ev){ev.stopPropagation();if(ev.target===gEl)gClose();});
  document.getElementById('gx').addEventListener('click',function(ev){ev.stopPropagation();gClose();});
  window.__grades={open:gOpen,close:gClose};

  window.addEventListener('resize',function(){clearTimeout(window.__f);window.__f=setTimeout(fit,150);});
  window.addEventListener('orientationchange',function(){setTimeout(fit,300);});
  if(window.visualViewport)visualViewport.addEventListener('resize',function(){clearTimeout(window.__f);window.__f=setTimeout(fit,150);});
  window.addEventListener('load',fit); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit); setTimeout(fit,800); setTimeout(fit,2500);
  tick(); setInterval(tick,15000);
  // fallback reload (meta refresh may be ignored in home-screen mode); bust caches
  setTimeout(function(){var u=location.href.split('?')[0];location.replace(u+'?r='+Date.now());},1800*1000+20000);
})();
</script>
</body>
</html>
